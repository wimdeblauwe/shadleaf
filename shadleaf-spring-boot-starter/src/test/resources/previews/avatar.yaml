# Scenarios for the avatar's docs page and the showcase. Rendered by PreviewGeneratorTest; see docs/README.md.
# renderSource takes the photo from previews/photos/ (${photos.shadcn}, a data: URI; shadcn's GitHub avatar, the one
# shadcn/ui's and basecoat's docs show), so the previews and the showcase checks never fetch an image. The broken URL
# is a data: URI holding bytes that are no image, which fails to load like a 404 does.
component: avatar
parts: [avatar-image, avatar-fallback]
scenarios:
  - id: default
    title: Avatar
    source: |-
      <sl:avatar label="shadcn">
        <sl:avatar-image th:src="@{/users/{id}/photo(id=${user.id})}"/>
        <sl:avatar-fallback>CN</sl:avatar-fallback>
      </sl:avatar>
    renderSource: |-
      <sl:avatar label="shadcn">
        <sl:avatar-image th:src="${photos.shadcn}"/>
        <sl:avatar-fallback>CN</sl:avatar-fallback>
      </sl:avatar>

  - id: fallback
    title: Fallback
    description: A user without a photo gets their initials; th:src with a null value renders an empty src, which shows the fallback.
    source: |-
      <sl:avatar label="Jane Doe">
        <sl:avatar-image th:src="${user.photoUrl}"/>
        <sl:avatar-fallback>JD</sl:avatar-fallback>
      </sl:avatar>
      <sl:avatar label="Unknown user">
        <sl:avatar-fallback><sl:icon name="user"/></sl:avatar-fallback>
      </sl:avatar>
    renderSource: |-
      <sl:avatar label="Jane Doe">
        <sl:avatar-image th:src="${null}"/>
        <sl:avatar-fallback>JD</sl:avatar-fallback>
      </sl:avatar>
      <sl:avatar label="Unknown user">
        <sl:avatar-fallback><sl:icon name="user"/></sl:avatar-fallback>
      </sl:avatar>

  - id: broken
    title: Broken image
    description: A photo URL that fails to load (a 404, a URL the Content-Security-Policy blocks, offline) shows the fallback, as does one that is still loading.
    source: |-
      <sl:avatar label="Grace Hopper">
        <sl:avatar-image th:src="@{/users/{id}/photo(id=${user.id})}"/>
        <sl:avatar-fallback>GH</sl:avatar-fallback>
      </sl:avatar>
    renderSource: |-
      <sl:avatar label="Grace Hopper">
        <sl:avatar-image src="data:image/png;base64,AAAA"/>
        <sl:avatar-fallback>GH</sl:avatar-fallback>
      </sl:avatar>

  - id: sizes
    title: Sizes
    source: |-
      <sl:avatar size="sm" label="Jane Doe"><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>
      <sl:avatar label="Jane Doe"><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>
      <sl:avatar size="lg" label="Jane Doe"><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>

  - id: decorative
    title: Next to a name
    description: Without a label the avatar is decorative; the name beside it is what a screen reader reads.
    source: |-
      <sl:avatar><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>
      <span>Jane Doe</span>
