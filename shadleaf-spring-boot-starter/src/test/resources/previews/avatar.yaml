# Scenarios for the avatar's docs page and the showcase. Rendered by PreviewGeneratorTest; see docs/README.md.
# renderSource uses a data: URI, so the previews and the showcase checks never fetch an image.
component: avatar
parts: [avatar-image, avatar-fallback]
scenarios:
  - id: default
    title: Avatar
    source: |-
      <sl:avatar label="Jane Doe">
        <sl:avatar-image th:src="@{/users/{id}/photo(id=${user.id})}"/>
        <sl:avatar-fallback>JD</sl:avatar-fallback>
      </sl:avatar>
    renderSource: |-
      <sl:avatar label="Jane Doe">
        <sl:avatar-image src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23b08968'/%3E%3Ccircle cx='20' cy='16' r='7' fill='%23f5ebe0'/%3E%3Cpath d='M6 40a14 14 0 0 1 28 0' fill='%23f5ebe0'/%3E%3C/svg%3E"/>
        <sl:avatar-fallback>JD</sl:avatar-fallback>
      </sl:avatar>

  - id: fallback
    title: Fallback
    description: A user without a photo gets their initials; th:src with a null value renders an empty src, which shows the fallback.
    source: |-
      <sl:avatar label="Jane Doe">
        <sl:avatar-image th:src="${user.photoUrl}"/>
        <sl:avatar-fallback>JD</sl:avatar-fallback>
      </sl:avatar>
      <sl:avatar label="Unknown user">
        <sl:avatar-fallback><sl:icon name="user"/></sl:avatar-fallback>
      </sl:avatar>
    renderSource: |-
      <sl:avatar label="Jane Doe">
        <sl:avatar-image th:src="${null}"/>
        <sl:avatar-fallback>JD</sl:avatar-fallback>
      </sl:avatar>
      <sl:avatar label="Unknown user">
        <sl:avatar-fallback><sl:icon name="user"/></sl:avatar-fallback>
      </sl:avatar>

  - id: sizes
    title: Sizes
    source: |-
      <sl:avatar size="sm" label="Jane Doe"><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>
      <sl:avatar label="Jane Doe"><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>
      <sl:avatar size="lg" label="Jane Doe"><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>

  - id: decorative
    title: Next to a name
    description: Without a label the avatar is decorative; the name beside it is what a screen reader reads.
    source: |-
      <sl:avatar><sl:avatar-fallback>JD</sl:avatar-fallback></sl:avatar>
      <span>Jane Doe</span>
