# Scenarios for the table's docs page and the showcase. Rendered by PreviewGeneratorTest; see docs/README.md.
component: table
parts: [table-head, table-empty, table-select-all, table-selection-count]
scenarios:
  - id: default
    title: Table
    source: |-
      <sl:table>
        <caption>A list of your recent invoices.</caption>
        <thead>
          <tr>
            <th>Invoice</th>
            <th>Status</th>
            <th>Method</th>
            <sl:table-head align="end">Amount</sl:table-head>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>INV001</td>
            <td><sl:badge variant="secondary">Paid</sl:badge></td>
            <td>Credit card</td>
            <td data-align="end">€250.00</td>
          </tr>
          <tr>
            <td>INV002</td>
            <td><sl:badge variant="outline">Pending</sl:badge></td>
            <td>Bank transfer</td>
            <td data-align="end">€150.00</td>
          </tr>
          <tr>
            <td>INV003</td>
            <td><sl:badge variant="destructive">Overdue</sl:badge></td>
            <td>Credit card</td>
            <td data-align="end">€350.00</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="3">Total</td>
            <td data-align="end">€750.00</td>
          </tr>
        </tfoot>
      </sl:table>

  - id: sort
    title: Sorted on the server
    description: Sorted by name, in a request for /people?q=a&sort=name,asc. Each link keeps q.
    request: /people?q=a&sort=name,asc
    source: |-
      <sl:table th:page="${people}">
        <thead>
          <tr>
            <sl:table-head sort="name">Name</sl:table-head>
            <sl:table-head sort="email">Email</sl:table-head>
            <sl:table-head sort="orders" align="end">Orders</sl:table-head>
          </tr>
        </thead>
        <tbody>
          <tr th:each="person : ${people}">
            <td th:text="${person.name}">Ada Lovelace</td>
            <td th:text="${person.email}">ada@example.com</td>
            <td data-align="end" th:text="${person.orders}">3</td>
          </tr>
        </tbody>
      </sl:table>
    renderSource: |-
      <sl:table>
        <thead>
          <tr>
            <sl:table-head sort="name">Name</sl:table-head>
            <sl:table-head sort="email">Email</sl:table-head>
            <sl:table-head sort="orders" align="end">Orders</sl:table-head>
          </tr>
        </thead>
        <tbody>
          <tr><td>Ada Lovelace</td><td>ada@example.com</td><td data-align="end">3</td></tr>
          <tr><td>Alan Turing</td><td>alan@example.com</td><td data-align="end">12</td></tr>
          <tr><td>Grace Hopper</td><td>grace@example.com</td><td data-align="end">7</td></tr>
        </tbody>
      </sl:table>

  - id: empty
    title: Nothing found
    source: |-
      <sl:table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="person : ${people}">
            <td th:text="${person.name}">Ada Lovelace</td>
            <td th:text="${person.email}">ada@example.com</td>
            <td th:text="${person.role}">Owner</td>
          </tr>
          <sl:table-empty colspan="3" th:if="${people.empty}"/>
        </tbody>
      </sl:table>
    renderSource: |-
      <sl:table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          <sl:table-empty colspan="3"/>
        </tbody>
      </sl:table>

  - id: selection
    title: Selecting rows
    description: The rows are plain checkboxes named ids; one is selected, so select-all starts indeterminate.
    source: |-
      <sl:table id="people-selection">
        <thead>
          <tr>
            <th><sl:table-select-all/></th>
            <th>Name</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="person : ${people}">
            <td><sl:checkbox name="ids" th:value="${person.id}"
                             th:aria-label="#{sl.table.select-row(${person.name})}"/></td>
            <td th:text="${person.name}">Ada Lovelace</td>
            <td th:text="${person.email}">ada@example.com</td>
          </tr>
        </tbody>
      </sl:table>
      <sl:table-selection-count table="people-selection"/>
    renderSource: |-
      <sl:table id="people-selection">
        <thead>
          <tr>
            <th><sl:table-select-all/></th>
            <th>Name</th>
            <th>Email</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><sl:checkbox name="ids" value="1" aria-label="Select Ada Lovelace" checked/></td>
            <td>Ada Lovelace</td>
            <td>ada@example.com</td>
          </tr>
          <tr>
            <td><sl:checkbox name="ids" value="2" aria-label="Select Alan Turing"/></td>
            <td>Alan Turing</td>
            <td>alan@example.com</td>
          </tr>
          <tr>
            <td><sl:checkbox name="ids" value="3" aria-label="Select Grace Hopper"/></td>
            <td>Grace Hopper</td>
            <td>grace@example.com</td>
          </tr>
        </tbody>
      </sl:table>
      <sl:table-selection-count table="people-selection"/>

  - id: row-actions
    title: Actions per row
    description: A menu in the last cell of each row, named after its row. In an application its items post or link (see Tables with htmx); here they do nothing.
    source: |-
      <sl:table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Role</th>
            <th data-align="end"><span class="sl-sr-only">Actions</span></th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="person : ${people}">
            <td th:text="${person.name}">Ada Lovelace</td>
            <td><sl:badge variant="secondary" th:text="${person.role.label}">Owner</sl:badge></td>
            <td data-align="end">
              <!--/* A role="menu" holds menu items only, so the form goes around the menu. */-->
              <form method="post" th:action="${selfUrl}">
                <input type="hidden" name="person" th:value="${person.id}">
                <sl:dropdown-menu th:id="|people-${person.id}-actions|">
                  <sl:dropdown-menu-trigger variant="ghost" size="icon-sm"
                                            th:aria-label="|Actions for ${person.name}|">
                    <sl:icon name="ellipsis"/>
                  </sl:dropdown-menu-trigger>
                  <sl:dropdown-menu-content align="end">
                    <sl:dropdown-menu-item as="a" th:href="@{/people/{id}(id=${person.id})}">
                      <sl:icon name="eye"/>View
                    </sl:dropdown-menu-item>
                    <sl:dropdown-menu-separator/>
                    <sl:dropdown-menu-label>Change role</sl:dropdown-menu-label>
                    <sl:dropdown-menu-radio-group aria-label="Change role">
                      <sl:dropdown-menu-radio-item th:each="role : ${roles}" type="submit" name="role"
                                                   th:value="${role}" th:checked="${person.role == role}">
                        [[${role.label}]]
                      </sl:dropdown-menu-radio-item>
                    </sl:dropdown-menu-radio-group>
                    <sl:dropdown-menu-separator/>
                    <sl:dropdown-menu-item as="a" variant="destructive"
                                           th:href="@{/people/{id}/delete(id=${person.id})}">
                      <sl:icon name="trash-2"/>Delete
                    </sl:dropdown-menu-item>
                  </sl:dropdown-menu-content>
                </sl:dropdown-menu>
              </form>
            </td>
          </tr>
        </tbody>
      </sl:table>
    renderSource: |-
      <sl:table>
        <thead>
          <tr>
