                  <sl:dropdown-menu-radio-group aria-label="Change role">
                    <sl:dropdown-menu-radio-item name="role" value="OWNER" checked>Owner</sl:dropdown-menu-radio-item>
                    <sl:dropdown-menu-radio-item name="role" value="ADMIN">Admin</sl:dropdown-menu-radio-item>
                    <sl:dropdown-menu-radio-item name="role" value="MEMBER">Member</sl:dropdown-menu-radio-item>
                    <sl:dropdown-menu-radio-item name="role" value="GUEST">Guest</sl:dropdown-menu-radio-item>
                  </sl:dropdown-menu-radio-group>
                  <sl:dropdown-menu-separator/>
                  <sl:dropdown-menu-item variant="destructive"><sl:icon name="trash-2"/>Delete</sl:dropdown-menu-item>
                </sl:dropdown-menu-content>
              </sl:dropdown-menu>
            </td>
          </tr>
          <tr>
            <td>Alan Turing</td>
            <td><sl:badge variant="outline">Member</sl:badge></td>
            <td data-align="end">
              <sl:dropdown-menu id="row-actions-2">
                <sl:dropdown-menu-trigger variant="ghost" size="icon-sm" aria-label="Actions for Alan Turing">
                  <sl:icon name="ellipsis"/>
                </sl:dropdown-menu-trigger>
                <sl:dropdown-menu-content align="end">
                  <sl:dropdown-menu-item as="a" href="#row-actions"><sl:icon name="eye"/>View</sl:dropdown-menu-item>
                  <sl:dropdown-menu-separator/>
                  <sl:dropdown-menu-label>Change role</sl:dropdown-menu-label>
                  <sl:dropdown-menu-radio-group aria-label="Change role">
                    <sl:dropdown-menu-radio-item name="role" value="OWNER">Owner</sl:dropdown-menu-radio-item>
                    <sl:dropdown-menu-radio-item name="role" value="ADMIN">Admin</sl:dropdown-menu-radio-item>
                    <sl:dropdown-menu-radio-item name="role" value="MEMBER" checked>Member</sl:dropdown-menu-radio-item>
