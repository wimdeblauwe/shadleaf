# Scenarios for the sidebar's docs page and the showcase. Rendered by PreviewGeneratorTest; see docs/README.md.
# A page holds one sidebar and one main, so only the first scenario is on the showcase (which puts it before its region
# of other components, as a page's shell). docs/tests/sidebar.spec.ts builds its fixture pages from that scenario: it
# expects Home to be the current page and links to /inbox, /calendar and /settings, a skip link before the provider and
# a breadcrumb in the inset's header ending in the page "Home", variant="inset" and collapsible="icon" (it sets both
# itself), a tooltip on every menu button, and a closed collapsible item "Documents" with links to /documents and
# /documents/shared. The header layout (scenario header, also at a phone's width as header-phone) is on its own showcase
# page, /showcase/header/, and docs/tests/sidebar-header.spec.ts builds its fixtures from it: it expects Home to be the
# current page, links to /inbox, /calendar and /documents in the row, a panel-only header, a panel-only Favorites group
# and a panel-only footer with /settings and /help.
component: sidebar
parts: [sidebar-provider, sidebar-trigger, sidebar-inset, sidebar-header, sidebar-content, sidebar-footer,
        sidebar-separator, sidebar-group, sidebar-group-label, sidebar-group-action, sidebar-group-content,
        sidebar-menu, sidebar-menu-item, sidebar-menu-button, sidebar-menu-action, sidebar-menu-badge,
        sidebar-menu-sub, sidebar-menu-sub-item, sidebar-menu-sub-button]
scenarios:
  - id: default
    title: Sidebar
    description: >-
      Where there are 768 px or more (here: the frame's width), the sidebar sits beside the page and the trigger (or
      Ctrl/⌘+B) collapses it, remembered in a cookie; narrower, the trigger opens it as a panel over the page. Rendered
      for a request for /, so #slNav.current('/') marks Home as the current page. The skip link (the first Tab) goes to
      the inset, whose header holds the trigger and the breadcrumb. variant="inset" makes the page a card on the
      sidebar's ground (from 768 px), and collapsible="icon" collapses it to a strip of icons whose tooltips show the
      labels, as sample-01's layout. Documents opens a sub-menu.
    request: /
    source: |-
      <sl:skip-link/>
      <sl:sidebar-provider>
        <sl:sidebar variant="inset" collapsible="icon">
          <sl:sidebar-header>
            <sl:sidebar-menu>
              <sl:sidebar-menu-item>
                <sl:sidebar-menu-button href="/" size="lg" tooltip="Acme Inc.">
                  <sl:slot name="icon-start"><sl:icon name="gallery-vertical-end"/></sl:slot>
                  <strong>Acme Inc.</strong>
                  <small>Enterprise</small>
                </sl:sidebar-menu-button>
              </sl:sidebar-menu-item>
            </sl:sidebar-menu>
          </sl:sidebar-header>
          <sl:sidebar-content>
            <sl:sidebar-group id="platform">
              <sl:sidebar-group-label>Platform</sl:sidebar-group-label>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" th:active="${#slNav.current('/')}" tooltip="Home">
                      <sl:slot name="icon-start"><sl:icon name="house"/></sl:slot>
                      Home
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item id="inbox">
                    <sl:sidebar-menu-button href="/inbox" th:active="${#slNav.current('/inbox')}" tooltip="Inbox">
                      <sl:slot name="icon-start"><sl:icon name="inbox"/></sl:slot>
                      Inbox
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-badge label="12 unread">12</sl:sidebar-menu-badge>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/calendar" th:active="${#slNav.current('/calendar')}" tooltip="Calendar">
                      <sl:slot name="icon-start"><sl:icon name="calendar"/></sl:slot>
                      Calendar
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item collapsible th:open="${#slNav.current('/documents')}">
                    <sl:sidebar-menu-button tooltip="Documents">
                      <sl:slot name="icon-start"><sl:icon name="file-text"/></sl:slot>
                      Documents
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-sub>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/documents"
                                                    th:active="${#slNav.current('/documents', true)}">
                          Recent
                        </sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/documents/shared"
                                                    th:active="${#slNav.current('/documents/shared')}">
                          Shared with me
                        </sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                    </sl:sidebar-menu-sub>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
            <sl:sidebar-group id="projects">
              <sl:sidebar-group-label>Projects</sl:sidebar-group-label>
              <sl:sidebar-group-action aria-label="Add project"><sl:icon name="plus"/></sl:sidebar-group-action>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/projects/design" tooltip="Design Engineering">
                      <sl:slot name="icon-start"><sl:icon name="frame"/></sl:slot>
                      Design Engineering
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-action aria-label="More for Design Engineering" show-on-hover>
                      <sl:icon name="ellipsis"/>
                    </sl:sidebar-menu-action>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/projects/sales" tooltip="Sales &amp; Marketing">
                      <sl:slot name="icon-start"><sl:icon name="chart-pie"/></sl:slot>
                      Sales &amp; Marketing
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-action aria-label="More for Sales &amp; Marketing" show-on-hover>
                      <sl:icon name="ellipsis"/>
                    </sl:sidebar-menu-action>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
          </sl:sidebar-content>
          <sl:sidebar-footer>
            <sl:sidebar-menu>
              <sl:sidebar-menu-item>
                <sl:sidebar-menu-button href="/settings" size="sm" th:active="${#slNav.current('/settings')}"
                                        tooltip="Settings">
                  <sl:slot name="icon-start"><sl:icon name="settings"/></sl:slot>
                  Settings
                </sl:sidebar-menu-button>
              </sl:sidebar-menu-item>
              <sl:sidebar-menu-item>
                <sl:sidebar-menu-button href="/help" size="sm" tooltip="Help">
                  <sl:slot name="icon-start"><sl:icon name="life-buoy"/></sl:slot>
                  Help
                </sl:sidebar-menu-button>
              </sl:sidebar-menu-item>
            </sl:sidebar-menu>
          </sl:sidebar-footer>
        </sl:sidebar>
        <sl:sidebar-inset>
          <sl:site-header>
            <sl:sidebar-trigger/>
            <sl:separator orientation="vertical"/>
            <sl:breadcrumb>
              <sl:breadcrumb-list>
                <sl:breadcrumb-item>Platform</sl:breadcrumb-item>
                <sl:breadcrumb-separator/>
                <sl:breadcrumb-item><sl:breadcrumb-page>Home</sl:breadcrumb-page></sl:breadcrumb-item>
              </sl:breadcrumb-list>
            </sl:breadcrumb>
          </sl:site-header>
          <h1>Home</h1>
          <p>The page's content.</p>
        </sl:sidebar-inset>
      </sl:sidebar-provider>

  - id: menu-button
    title: Menu buttons
    description: >-
      The sizes, the outline variant, a button marked as the current one (aria-current="true"), and disabled entries.
    showcase: false
    source: |-
      <sl:sidebar-provider>
        <sl:sidebar id="sidebar-buttons">
          <sl:sidebar-content>
            <sl:sidebar-group>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" size="lg">
                      <sl:slot name="icon-start"><sl:icon name="gallery-vertical-end"/></sl:slot>
                      <strong>Large</strong>
                      <small>Two lines</small>
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/">
                      <sl:slot name="icon-start"><sl:icon name="house"/></sl:slot>
                      Default
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" size="sm">
                      <sl:slot name="icon-start"><sl:icon name="house"/></sl:slot>
                      Small
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" variant="outline">
                      <sl:slot name="icon-start"><sl:icon name="square-dashed"/></sl:slot>
                      Outline
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button as="button" active>
                      <sl:slot name="icon-start"><sl:icon name="file-pen"/></sl:slot>
                      Drafts (a button)
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/billing" disabled>
                      <sl:slot name="icon-start"><sl:icon name="credit-card"/></sl:slot>
                      Disabled link
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/a-page-with-a-very-long-name">
                      <sl:slot name="icon-start"><sl:icon name="file-text"/></sl:slot>
                      A label too long for the sidebar ends in an ellipsis
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
          </sl:sidebar-content>
        </sl:sidebar>
        <sl:sidebar-inset>
          <sl:site-header>
            <sl:sidebar-trigger for="sidebar-buttons"/>
          </sl:site-header>
          <h1>Menu buttons</h1>
        </sl:sidebar-inset>
      </sl:sidebar-provider>

  - id: side
    title: On the end
    description: side="end" puts the sidebar on the end of the line (the right, or the left on a right-to-left page).
    showcase: false
    source: |-
      <sl:sidebar-provider>
        <sl:sidebar id="sidebar-end" side="end">
          <sl:sidebar-content>
            <sl:sidebar-group>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" active>Home</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/inbox">Inbox</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/settings">Settings</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
          </sl:sidebar-content>
        </sl:sidebar>
        <sl:sidebar-inset>
          <sl:site-header>
            <sl:sidebar-trigger for="sidebar-end"/>
          </sl:site-header>
          <h1>Home</h1>
        </sl:sidebar-inset>
      </sl:sidebar-provider>

  - id: collapsed
    title: Collapsed
    description: >-
      state="collapsed" renders the sidebar collapsed whatever the cookie says, for an application that keeps the
      choice itself; default-state="collapsed" only until the user chose.
    showcase: false
    source: |-
      <sl:sidebar-provider state="collapsed">
        <sl:sidebar id="sidebar-collapsed">
          <sl:sidebar-content>
            <sl:sidebar-group>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" active>Home</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/settings">Settings</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
          </sl:sidebar-content>
        </sl:sidebar>
        <sl:sidebar-inset>
          <sl:site-header>
            <sl:sidebar-trigger for="sidebar-collapsed"/>
          </sl:site-header>
          <h1>Home</h1>
        </sl:sidebar-inset>
      </sl:sidebar-provider>

  - id: variant
    title: Variants
    description: >-
      variant="sidebar" (the default) is a column along the edge with a border, variant="floating" a panel with a
      margin all round; the inset variant is the first example. On a phone the panel is the same for all three.
    showcase: false
    source: |-
      <sl:sidebar-provider>
        <sl:sidebar id="sidebar-floating" variant="floating">
          <sl:sidebar-content>
            <sl:sidebar-group>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" active>Home</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/inbox">Inbox</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/settings">Settings</sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
          </sl:sidebar-content>
        </sl:sidebar>
        <sl:sidebar-inset>
          <sl:site-header>
            <sl:sidebar-trigger for="sidebar-floating"/>
          </sl:site-header>
          <h1>Floating</h1>
        </sl:sidebar-inset>
      </sl:sidebar-provider>

  - id: icon
    title: Collapsed to icons
    description: >-
      collapsible="icon" collapses the sidebar to a strip of its menu buttons' icons (from 768 px). The labels stay the
      buttons' names; a tooltip shows them on hover and keyboard focus. Badges, actions and sub-menus are hidden; the
      icon of a group holding the current page (here: Billing, below Settings) is marked, and a click on it expands
      the sidebar with the group open. Rendered collapsed (state="collapsed"), for a request for /settings/billing.
    showcase: false
    request: /settings/billing
    source: |-
      <sl:sidebar-provider state="collapsed">
        <sl:sidebar id="sidebar-icon" collapsible="icon">
          <sl:sidebar-header>
            <sl:sidebar-menu>
              <sl:sidebar-menu-item>
                <sl:sidebar-menu-button href="/" size="lg" tooltip="Acme Inc.">
                  <sl:slot name="icon-start"><sl:icon name="gallery-vertical-end"/></sl:slot>
                  <strong>Acme Inc.</strong>
                  <small>Enterprise</small>
                </sl:sidebar-menu-button>
              </sl:sidebar-menu-item>
            </sl:sidebar-menu>
          </sl:sidebar-header>
          <sl:sidebar-content>
            <sl:sidebar-group id="icon-platform">
              <sl:sidebar-group-label>Platform</sl:sidebar-group-label>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item>
                    <sl:sidebar-menu-button href="/" th:active="${#slNav.current('/')}" tooltip="Home">
                      <sl:slot name="icon-start"><sl:icon name="house"/></sl:slot>
                      Home
                    </sl:sidebar-menu-button>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item id="icon-inbox">
                    <sl:sidebar-menu-button href="/inbox" th:active="${#slNav.current('/inbox')}" tooltip="Inbox">
                      <sl:slot name="icon-start"><sl:icon name="inbox"/></sl:slot>
                      Inbox
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-badge label="12 unread">12</sl:sidebar-menu-badge>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item collapsible th:open="${#slNav.current('/settings')}">
                    <sl:sidebar-menu-button tooltip="Settings">
                      <sl:slot name="icon-start"><sl:icon name="settings"/></sl:slot>
                      Settings
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-sub>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/settings"
                                                    th:active="${#slNav.current('/settings', true)}">
                          General
                        </sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/settings/billing"
                                                    th:active="${#slNav.current('/settings/billing')}">
                          Billing
                        </sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                    </sl:sidebar-menu-sub>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
          </sl:sidebar-content>
        </sl:sidebar>
        <sl:sidebar-inset>
          <sl:site-header>
            <sl:sidebar-trigger for="sidebar-icon"/>
          </sl:site-header>
          <h1>Billing</h1>
        </sl:sidebar-inset>
      </sl:sidebar-provider>

  - id: sub-menu
    title: Collapsible groups
    description: >-
      A collapsible sl:sidebar-menu-item is a group that opens and closes on the browser's details element, no
      JavaScript needed; its sl:sidebar-menu-button is what the user clicks, its sl:sidebar-menu-sub the links. The
      server opens the group holding the current page (th:open with #slNav.current), here /settings/billing.
      Sub-buttons come in two sizes.
    showcase: false
    request: /settings/billing
    source: |-
      <sl:sidebar-provider>
        <sl:sidebar id="sidebar-sub">
          <sl:sidebar-content>
            <sl:sidebar-group id="sub-platform">
              <sl:sidebar-group-label>Platform</sl:sidebar-group-label>
              <sl:sidebar-group-content>
                <sl:sidebar-menu>
                  <sl:sidebar-menu-item collapsible th:open="${#slNav.current('/projects')}">
                    <sl:sidebar-menu-button>
                      <sl:slot name="icon-start"><sl:icon name="folder"/></sl:slot>
                      Projects
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-sub>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/projects/design">Design Engineering</sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/projects/sales">Sales &amp; Marketing</sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                    </sl:sidebar-menu-sub>
                  </sl:sidebar-menu-item>
                  <sl:sidebar-menu-item collapsible th:open="${#slNav.current('/settings')}">
                    <sl:sidebar-menu-button>
                      <sl:slot name="icon-start"><sl:icon name="settings"/></sl:slot>
                      Settings
                    </sl:sidebar-menu-button>
                    <sl:sidebar-menu-sub>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/settings"
                                                    th:active="${#slNav.current('/settings', true)}">
                          General
                        </sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/settings/billing"
                                                    th:active="${#slNav.current('/settings/billing')}">
                          Billing
                        </sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                      <sl:sidebar-menu-sub-item>
                        <sl:sidebar-menu-sub-button href="/settings/limits" size="sm">
                          Limits (small)
                        </sl:sidebar-menu-sub-button>
                      </sl:sidebar-menu-sub-item>
                    </sl:sidebar-menu-sub>
                  </sl:sidebar-menu-item>
                </sl:sidebar-menu>
              </sl:sidebar-group-content>
            </sl:sidebar-group>
          </sl:sidebar-content>
        </sl:sidebar>
        <sl:sidebar-inset>
          <sl:site-header>
            <sl:sidebar-trigger for="sidebar-sub"/>
          </sl:site-header>
          <h1>Billing</h1>
        </sl:sidebar-inset>
      </sl:sidebar-provider>
  - id: header
    title: Header layout
    description: >-
      placement="header" puts the same navigation in a sl:site-header: from 768 px a row of links (the current page
      marked as in the sidebar), with the application's name before it and search and the theme toggle at the end.
      Favorites, Settings and Help are panel-only, so the row stays short; the panel's own header with the name is
      panel-only too. variant="inset" makes the page a card below the header. Narrower, the menu button opens the
      same nav as the panel: see the next example.
    showcase: false
    request: /
    source: &header-source |-
      <sl:skip-link/>
      <sl:sidebar-provider>
        <sl:site-header>
          <sl:sidebar-trigger aria-label="Menu"><sl:icon name="menu"/></sl:sidebar-trigger>
          <sl:button as="a" href="/" variant="ghost">
            <sl:slot name="icon-start"><sl:icon name="gallery-vertical-end"/></sl:slot>
            Acme Inc.
          </sl:button>
          <sl:sidebar placement="header" variant="inset">
            <sl:sidebar-header panel-only>
              <sl:sidebar-menu>
                <sl:sidebar-menu-item>
                  <sl:sidebar-menu-button href="/" size="lg">
                    <sl:slot name="icon-start"><sl:icon name="gallery-vertical-end"/></sl:slot>
                    <strong>Acme Inc.</strong>
                    <small>Enterprise</small>
                  </sl:sidebar-menu-button>
                </sl:sidebar-menu-item>
              </sl:sidebar-menu>
            </sl:sidebar-header>
            <sl:sidebar-content>
              <sl:sidebar-group>
                <sl:sidebar-group-content>
                  <sl:sidebar-menu>
                    <sl:sidebar-menu-item>
                      <sl:sidebar-menu-button href="/" th:active="${#slNav.current('/')}">
                        <sl:slot name="icon-start"><sl:icon name="house"/></sl:slot>
                        Home
                      </sl:sidebar-menu-button>
                    </sl:sidebar-menu-item>
                    <sl:sidebar-menu-item id="header-inbox">
                      <sl:sidebar-menu-button href="/inbox" th:active="${#slNav.current('/inbox')}">
                        <sl:slot name="icon-start"><sl:icon name="inbox"/></sl:slot>
                        Inbox
                      </sl:sidebar-menu-button>
                      <sl:sidebar-menu-badge label="12 unread">12</sl:sidebar-menu-badge>
                    </sl:sidebar-menu-item>
                    <sl:sidebar-menu-item>
                      <sl:sidebar-menu-button href="/calendar" th:active="${#slNav.current('/calendar')}">
                        <sl:slot name="icon-start"><sl:icon name="calendar"/></sl:slot>
                        Calendar
                      </sl:sidebar-menu-button>
                    </sl:sidebar-menu-item>
                    <sl:sidebar-menu-item>
                      <sl:sidebar-menu-button href="/documents" th:active="${#slNav.current('/documents')}">
                        <sl:slot name="icon-start"><sl:icon name="file-text"/></sl:slot>
                        Documents
                      </sl:sidebar-menu-button>
                    </sl:sidebar-menu-item>
                  </sl:sidebar-menu>
                </sl:sidebar-group-content>
              </sl:sidebar-group>
              <sl:sidebar-group id="favorites" panel-only>
                <sl:sidebar-group-label>Favorites</sl:sidebar-group-label>
                <sl:sidebar-group-content>
                  <sl:sidebar-menu>
                    <sl:sidebar-menu-item>
                      <sl:sidebar-menu-button href="/projects/marketing">
                        <sl:slot name="icon-start"><sl:icon name="globe"/></sl:slot>
                        Marketing site
                      </sl:sidebar-menu-button>
                    </sl:sidebar-menu-item>
                    <sl:sidebar-menu-item>
                      <sl:sidebar-menu-button href="/projects/android">
                        <sl:slot name="icon-start"><sl:icon name="smartphone"/></sl:slot>
                        Android app
                      </sl:sidebar-menu-button>
                    </sl:sidebar-menu-item>
                  </sl:sidebar-menu>
                </sl:sidebar-group-content>
              </sl:sidebar-group>
            </sl:sidebar-content>
            <sl:sidebar-footer panel-only>
              <sl:sidebar-menu>
                <sl:sidebar-menu-item>
                  <sl:sidebar-menu-button href="/settings" size="sm" th:active="${#slNav.current('/settings')}">
                    <sl:slot name="icon-start"><sl:icon name="settings"/></sl:slot>
                    Settings
                  </sl:sidebar-menu-button>
                </sl:sidebar-menu-item>
                <sl:sidebar-menu-item>
                  <sl:sidebar-menu-button href="/help" size="sm">
                    <sl:slot name="icon-start"><sl:icon name="life-buoy"/></sl:slot>
                    Help
                  </sl:sidebar-menu-button>
                </sl:sidebar-menu-item>
              </sl:sidebar-menu>
            </sl:sidebar-footer>
          </sl:sidebar>
          <sl:slot name="end">
            <sl:button variant="ghost" size="icon-sm" aria-label="Search"><sl:icon name="search"/></sl:button>
            <sl:theme-toggle/>
          </sl:slot>
        </sl:site-header>
        <sl:sidebar-inset>
          <h1>Home</h1>
