# Scenarios for the combobox's docs page and the showcase. Rendered by PreviewGeneratorTest; see docs/README.md.
# Ids are unique across the showcase: th:field gives the select the field's name as its id.
component: combobox
parts: [combobox-item, combobox-group, combobox-separator]
scenarios:
  - id: default
    title: Combobox
    description: Type to filter the list; th:field marks the bound item.
    source: |-
      <sl:field th:field="*{framework}">
        <sl:field-label>Framework</sl:field-label>
        <sl:combobox placeholder="Select a framework">
          <sl:combobox-item value="next">Next.js</sl:combobox-item>
          <sl:combobox-item value="sveltekit">SvelteKit</sl:combobox-item>
          <sl:combobox-item value="nuxt">Nuxt.js</sl:combobox-item>
          <sl:combobox-item value="remix">Remix</sl:combobox-item>
          <sl:combobox-item value="astro">Astro</sl:combobox-item>
        </sl:combobox>
      </sl:field>
    form:
      values: {framework: ''}

  - id: multiple
    title: Multiple
    description: With multiple, the chosen items are chips before the input and th:field binds a collection.
    source: |-
      <sl:field th:field="*{frameworks}">
        <sl:field-label>Frameworks</sl:field-label>
        <sl:combobox multiple auto-highlight placeholder="Add a framework">
          <sl:combobox-item value="next">Next.js</sl:combobox-item>
          <sl:combobox-item value="sveltekit">SvelteKit</sl:combobox-item>
          <sl:combobox-item value="nuxt">Nuxt.js</sl:combobox-item>
          <sl:combobox-item value="remix">Remix</sl:combobox-item>
          <sl:combobox-item value="astro">Astro</sl:combobox-item>
        </sl:combobox>
      </sl:field>
    form:
      values: {frameworks: [next]}

  - id: clear
    title: Clear button
    description: show-clear puts a button that clears the choice in place of the chevron while there is one.
    source: |-
      <sl:field th:field="*{stack}">
        <sl:field-label>Stack</sl:field-label>
        <sl:combobox placeholder="Select a framework" show-clear>
          <sl:combobox-item value="next">Next.js</sl:combobox-item>
          <sl:combobox-item value="sveltekit">SvelteKit</sl:combobox-item>
          <sl:combobox-item value="nuxt">Nuxt.js</sl:combobox-item>
        </sl:combobox>
      </sl:field>
    form:
      values: {stack: sveltekit}

