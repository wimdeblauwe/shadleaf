        </sl:attachment>
        <sl:attachment orientation="vertical">
          <sl:attachment-media variant="image">
            <img th:src="${photos.forest}" alt="Three fir trees">
          </sl:attachment-media>
        </sl:attachment>
        <sl:attachment orientation="vertical">
          <sl:attachment-media variant="image">
            <img th:src="${photos.dunes}" alt="Orange dunes under a low sun">
