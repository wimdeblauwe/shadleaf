  - id: group-label
    title: Group without actions
    description: Attachments without actions or a trigger give the keyboard nothing to tab to. label makes the group a named group that takes the focus, so the arrow keys scroll it.
    source: |-
      <sl:attachment-group label="Reference photos">
        <sl:attachment orientation="vertical" th:each="photo : ${photos}">
          <sl:attachment-media variant="image">
            <img th:src="@{/files/{id}/thumbnail(id=${photo.id})}" th:alt="${photo.description}" loading="lazy">
          </sl:attachment-media>
        </sl:attachment>
      </sl:attachment-group>
    renderSource: |-
      <sl:attachment-group label="Reference photos">
        <sl:attachment orientation="vertical">
          <sl:attachment-media variant="image">
            <img th:src="${photos.dunes}" alt="Orange dunes under a low sun">
          </sl:attachment-media>
        </sl:attachment>
        <sl:attachment orientation="vertical">
          <sl:attachment-media variant="image">
            <img th:src="${photos.lake}" alt="A mountain lake">
