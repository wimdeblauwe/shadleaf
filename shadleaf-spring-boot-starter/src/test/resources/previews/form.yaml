# Scenarios for the form's docs page and the showcase. Rendered by PreviewGeneratorTest; see docs/README.md.
# The form object is the scenario's form; sl:form selects it with th:object="${form}". Ids are unique across the
# showcase: th:field gives each control the field's name as its id.
component: form
scenarios:
  - id: default
    title: Form
    description: A form element that passes every attribute on (th:object, th:action, method). sl:field-group lays out its fields.
    source: |-
      <sl:form th:object="${form}" action="/rooms" method="post">
        <sl:field-group>
          <sl:field th:field="*{roomName}">
            <sl:field-label>Name</sl:field-label>
            <sl:input/>
          </sl:field>
          <sl:field th:field="*{roomCapacity}">
            <sl:field-label>Capacity</sl:field-label>
            <sl:input type="number" min="1"/>
          </sl:field>
          <sl:field orientation="horizontal">
            <sl:button type="submit">Save</sl:button>
          </sl:field>
        </sl:field-group>
      </sl:form>
    form:
      values: {roomName: 'Boardroom', roomCapacity: 12}

  - id: validate
    title: Validating as you type
    description: With validate, each control posts the form to that URL while the user edits it (htmx 4), and swaps its own field from the response. The end time depends on the start, so validating the start swaps the end time too, once it has a value.
    source: |-
      <sl:form th:object="${form}" action="/bookings" th:validate="@{/bookings/validate}" method="post">
        <sl:field-group>
          <sl:field th:field="*{bookingTitle}">
            <sl:field-label>Title</sl:field-label>
            <sl:input/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{bookingStart}">
            <sl:field-label>Start</sl:field-label>
            <sl:input type="time"/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{bookingEnd}" depends-on="bookingStart">
            <sl:field-label>End</sl:field-label>
            <sl:input type="time"/>
            <sl:field-error/>
          </sl:field>
          <sl:field orientation="horizontal">
            <sl:button type="submit">Book</sl:button>
          </sl:field>
        </sl:field-group>
      </sl:form>
    form:
      values: {bookingTitle: '', bookingStart: '10:00', bookingEnd: '09:30'}
      errors:
        bookingEnd: The meeting must end after it starts.

  # The fixture of docs/tests/form-validate.spec.ts, off the docs page and the showcase: the same form rendered valid
  # and with an error on every field. The spec's server answers a validation request with the fields of one or the
  # other and the posted values, as an application's controller would.
  - id: fixture-valid
    title: Every control, valid
    showcase: false
    source: &controls |-
      <sl:form th:object="${form}" action="/save" th:validate="@{/validate}" method="post">
        <sl:field-group>
          <sl:field th:field="*{title}">
            <sl:field-label>Title</sl:field-label>
            <sl:input/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{password}">
            <sl:field-label>Password</sl:field-label>
            <sl:input type="password"/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{notes}">
            <sl:field-label>Notes</sl:field-label>
            <sl:field-description>At most 20 characters.</sl:field-description>
            <sl:textarea/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{start}">
            <sl:field-label>Start</sl:field-label>
            <sl:input type="time"/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{end}" depends-on="start">
            <sl:field-label>End</sl:field-label>
            <sl:input type="time"/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{room}">
            <sl:field-label>Room</sl:field-label>
            <sl:native-select>
              <option value="">Select a room</option>
              <option value="atrium">Atrium</option>
              <option value="cellar">Cellar</option>
            </sl:native-select>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{fruit}">
            <sl:field-label>Fruit</sl:field-label>
            <sl:select placeholder="Select a fruit">
              <sl:select-item value="apple">Apple</sl:select-item>
              <sl:select-item value="banana">Banana</sl:select-item>
            </sl:select>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{framework}">
            <sl:field-label>Framework</sl:field-label>
            <sl:combobox placeholder="Select a framework">
              <sl:combobox-item value="astro">Astro</sl:combobox-item>
              <sl:combobox-item value="remix">Remix</sl:combobox-item>
            </sl:combobox>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{day}">
            <sl:field-label>Day</sl:field-label>
            <sl:date-picker/>
            <sl:field-error/>
          </sl:field>
          <sl:field-set th:field="*{plan}">
            <sl:field-legend variant="label">Plan</sl:field-legend>
            <sl:radio-group>
              <sl:label><sl:radio-group-item value="monthly"/>Monthly</sl:label>
              <sl:label><sl:radio-group-item value="yearly"/>Yearly</sl:label>
            </sl:radio-group>
            <sl:field-error/>
          </sl:field-set>
          <sl:field th:field="*{terms}" orientation="horizontal">
            <sl:checkbox/>
            <sl:field-content>
              <sl:field-label>I accept the terms</sl:field-label>
              <sl:field-error/>
            </sl:field-content>
          </sl:field>
          <sl:field th:field="*{updates}" orientation="horizontal">
            <sl:switch/>
            <sl:field-content>
              <sl:field-label>Product updates</sl:field-label>
              <sl:field-error/>
            </sl:field-content>
          </sl:field>
          <sl:field orientation="horizontal">
            <sl:button type="submit">Save</sl:button>
          </sl:field>
        </sl:field-group>
      </sl:form>
    form:
      values: {title: '', password: '', notes: '', start: '', end: '', room: '', fruit: '', framework: '', day: '',
               plan: '', terms: false, updates: false}

  - id: fixture-invalid
    title: Every control, invalid
    showcase: false
    source: *controls
    form:
      values: {title: '', password: '', notes: '', start: '', end: '', room: '', fruit: '', framework: '', day: '',
               plan: '', terms: false, updates: false}
      errors: {title: Title error, password: Password error, notes: Notes error, start: Start error, end: End error,
               room: Room error, fruit: Fruit error, framework: Framework error, day: Day error, plan: Plan error,
               terms: Terms error, updates: Updates error}
