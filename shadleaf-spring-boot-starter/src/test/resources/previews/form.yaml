# Scenarios for the form's docs page and the showcase. Rendered by PreviewGeneratorTest; see docs/README.md.
# The form object is the scenario's form; sl:form selects it with th:object="${form}". Ids are unique across the
# showcase: th:field gives each control the field's name as its id.
component: form
scenarios:
  - id: default
    title: Form
    description: A form element that passes every attribute on (th:object, th:action, method). sl:field-group lays out its fields.
    source: |-
      <sl:form th:object="${form}" action="/rooms" method="post">
        <sl:field-group>
          <sl:field th:field="*{roomName}">
            <sl:field-label>Name</sl:field-label>
            <sl:input/>
          </sl:field>
          <sl:field th:field="*{roomCapacity}">
            <sl:field-label>Capacity</sl:field-label>
            <sl:input type="number" min="1"/>
          </sl:field>
          <sl:field orientation="horizontal">
            <sl:button type="submit">Save</sl:button>
          </sl:field>
        </sl:field-group>
      </sl:form>
    form:
      values: {roomName: 'Boardroom', roomCapacity: 12}

  - id: validate
    title: Validating as you type
    description: With validate, each control posts the form to that URL while the user edits it (htmx 4), and swaps its own field from the response. The end time depends on the start, so validating the start swaps the end time too, once it has a value.
    source: |-
      <sl:form th:object="${form}" action="/bookings" th:validate="@{/bookings/validate}" method="post">
        <sl:field-group>
          <sl:field th:field="*{bookingTitle}">
            <sl:field-label>Title</sl:field-label>
            <sl:input/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{bookingStart}">
            <sl:field-label>Start</sl:field-label>
            <sl:input type="time"/>
            <sl:field-error/>
          </sl:field>
          <sl:field th:field="*{bookingEnd}" depends-on="bookingStart">
            <sl:field-label>End</sl:field-label>
            <sl:input type="time"/>
            <sl:field-error/>
          </sl:field>
          <sl:field orientation="horizontal">
            <sl:button type="submit">Book</sl:button>
          </sl:field>
        </sl:field-group>
      </sl:form>
    form:
      values: {bookingTitle: '', bookingStart: '10:00', bookingEnd: '09:30'}
      errors:
        bookingEnd: The meeting must end after it starts.
