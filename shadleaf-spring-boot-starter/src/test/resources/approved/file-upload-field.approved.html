<div class="field" data-invalid="true">
  <label class="label field-label" for="files">Attachments</label>
  <div class="file-upload" x-data="slFileUpload">
    <input type="file" class="file-upload-input sl-sr-only" multiple aria-describedby="files-error" aria-invalid="true" id="files" name="files">
    <div class="empty file-upload-dropzone" data-border="dashed">
      <div class="empty-header">
        <div class="empty-media" data-variant="icon">
          <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
        </div>
        <div class="empty-title">Upload files</div>
      </div>
      <div class="empty-content">
        <label class="button file-upload-browse" for="files">Browse files</label>
      </div>
    </div>
    <ul class="file-upload-list" hidden></ul>
    <div class="file-upload-status sl-sr-only" role="status" data-message-added="Added {0}." data-message-removed="Removed {0}." data-message-rejected="Could not add {0}: {1}."></div>
    <template class="file-upload-template" data-kind="file">
      <li class="file-upload-item">
        <div class="attachment" data-state="idle" data-size="sm" data-width="full">
          <div class="attachment-media">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
          </div>
          <div class="attachment-content">
            <span class="attachment-title"></span>
            <span class="attachment-description"></span>
          </div>
          <div class="attachment-actions">
            <button class="button attachment-action" type="button" data-variant="ghost" data-size="icon-xs" aria-label="Remove {0}">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
            </button>
          </div>
        </div>
      </li>
    </template>
    <template class="file-upload-template" data-kind="rejected" data-message-type="File type not accepted" data-message-size="Larger than {0}" data-message-count="Only one file can be added">
      <li class="file-upload-item">
        <div class="attachment" data-state="error" data-size="sm" data-width="full">
          <div class="attachment-media">
            <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
          </div>
          <div class="attachment-content">
            <span class="attachment-title"></span>
            <span class="attachment-description"></span>
          </div>
          <div class="attachment-actions">
            <button class="button attachment-action" type="button" data-variant="ghost" data-size="icon-xs" aria-label="Dismiss {0}">
              <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
            </button>
          </div>
        </div>
      </li>
    </template>
  </div>
  <div class="field-error" id="files-error">Add at least one file</div>
</div>
