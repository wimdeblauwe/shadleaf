<sl-chart class="chart mt-4" label="Visitors, January to June" margin="12" time-zone="Europe/Brussels" id="visitors">
  <script type="application/json">
  </script>
  <sl-chart-grid class="chart-grid" vertical="true"></sl-chart-grid>
  <sl-chart-x-axis class="chart-x-axis" key="month" tick-margin="10" min-tick-gap="32"></sl-chart-x-axis>
  <sl-chart-y-axis class="chart-y-axis" tick-margin="4" tick-count="3"></sl-chart-y-axis>
  <sl-chart-tooltip class="chart-tooltip" value-format="number"></sl-chart-tooltip>
  <sl-chart-legend class="chart-legend"></sl-chart-legend>
  <sl-chart-bar class="chart-bar" key="desktop" label="Desktop" color="var(--chart-1)" color-dark="var(--chart-3)" radius="4"></sl-chart-bar>
  <sl-chart-line class="chart-line" key="mobile" label="Mobile" curve="linear" dots="true" stroke-width="3"></sl-chart-line>
  <sl-chart-area class="chart-area" key="tablet" label="Tablet" stack="a" fill-opacity="0.8"></sl-chart-area>
  <div class="chart-skeleton"></div>
</sl-chart>
