<!-- <sl:checkbox name="terms"/> -->
<span class="checkbox-wrapper">
  <input type="checkbox" class="checkbox" name="terms">
  <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon checkbox-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
</span>

<!-- <sl:checkbox id="terms" name="terms" value="yes" checked required/> -->
<span class="checkbox-wrapper">
  <input type="checkbox" class="checkbox" id="terms" name="terms" value="yes" checked required>
  <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon checkbox-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
</span>

<!-- <sl:checkbox name="terms" disabled aria-invalid="true" class="ms-2"/> -->
<span class="checkbox-wrapper ms-2">
  <input type="checkbox" class="checkbox" name="terms" disabled aria-invalid="true">
  <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon checkbox-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
</span>

<!-- <sl:label><sl:checkbox name="newsletter"/>Send me the newsletter</sl:label> -->
<label class="label">
  <span class="checkbox-wrapper">
    <input type="checkbox" class="checkbox" name="newsletter">
    <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon checkbox-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  </span>
  Send me the newsletter
</label>
