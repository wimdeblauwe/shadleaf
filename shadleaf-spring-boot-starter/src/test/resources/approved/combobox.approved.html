    <option value="" hidden data-placeholder="true"></option>
    <option class="combobox-item" value="next">Next.js</option>
  </select>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon combobox-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  <template class="combobox-template">
    <div class="combobox-control">
      <input class="combobox-input" type="text" role="combobox" autocomplete="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false">
      <button type="button" class="combobox-trigger" tabindex="-1" aria-expanded="false" aria-label="Show options">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>

    <div class="combobox-content" popover="manual">
      <div class="combobox-list" role="listbox"></div>
      <div class="combobox-empty">No items found.</div>
    </div>
    <div class="combobox-status" role="status"></div>
    <svg xmlns="http://www.w3.org/2000/svg" class="icon combobox-item-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>

</div>

<div class="combobox w-full" x-data="slCombobox" data-auto-highlight="true" data-result="1 result" data-results="{0} results">
  <select class="combobox-select" id="framework" name="framework" required>
    <option value="" hidden data-placeholder="true">Select a framework</option>
    <optgroup class="combobox-group" label="React">
      <option class="combobox-item" value="next">Next.js</option>
      <option class="combobox-item" value="remix" disabled>Remix</option>
    </optgroup>
    <hr class="combobox-separator">
    <optgroup class="combobox-group" label="Vue">
      <option class="combobox-item" value="nuxt" selected>Nuxt.js</option>
    </optgroup>
  </select>
  <svg xmlns="http://www.w3.org/2000/svg" class="icon combobox-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  <template class="combobox-template">
    <div class="combobox-control">
      <input class="combobox-input" type="text" role="combobox" autocomplete="off" autocapitalize="off" spellcheck="false" aria-autocomplete="list" aria-expanded="false" placeholder="Select a framework">
      <button type="button" class="combobox-clear" tabindex="-1" hidden aria-label="Clear">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
      </button>
      <button type="button" class="combobox-trigger" tabindex="-1" aria-expanded="false" aria-label="Show options">
        <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
      </button>
    </div>
    <div class="combobox-content" popover="manual">
      <div class="combobox-list" role="listbox"></div>
      <div class="combobox-empty">No frameworks found.</div>
    </div>
    <div class="combobox-status" role="status"></div>
    <svg xmlns="http://www.w3.org/2000/svg" class="icon combobox-item-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  </template>
</div>
