<dialog class="dialog wide" id="edit-profile" closedby="any" x-data="slDialog" aria-labelledby="edit-profile-title" aria-describedby="edit-profile-description">
  <div class="dialog-header">
    <div class="dialog-title" role="heading" aria-level="2" id="edit-profile-title">Edit profile</div>
    <div class="dialog-description" id="edit-profile-description">Make changes to your profile.</div>
  </div>
  <p>Content</p>
  <div class="dialog-footer">
    <button class="btn" type="submit">Save changes</button>
    <button class="btn" type="button" data-variant="outline" commandfor="edit-profile" command="close">Close</button>
  </div>
  <button class="btn dialog-close" type="button" data-variant="ghost" data-size="icon-sm" commandfor="edit-profile" command="close" aria-label="Close">
    <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  </button>
</dialog>
