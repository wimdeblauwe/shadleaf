<!-- <sl:toggle variant="default" name="bold" aria-label="Bold"><sl:icon name="bold"/></sl:toggle> -->
<label class="toggle">
  <input type="checkbox" class="toggle-input" name="bold" aria-label="Bold">
  <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
</label>

<!-- <sl:toggle variant="outline" name="bold" aria-label="Bold"><sl:icon name="bold"/></sl:toggle> -->
<label class="toggle" data-variant="outline">
  <input type="checkbox" class="toggle-input" name="bold" aria-label="Bold">
  <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
</label>

<!-- <sl:toggle size="sm" name="italic">Italic</sl:toggle> -->
<label class="toggle" data-size="sm">
  <input type="checkbox" class="toggle-input" name="italic">
  Italic
</label>

<!-- <sl:toggle size="default" name="italic">Italic</sl:toggle> -->
<label class="toggle">
  <input type="checkbox" class="toggle-input" name="italic">
  Italic
</label>

<!-- <sl:toggle size="lg" name="italic">Italic</sl:toggle> -->
<label class="toggle" data-size="lg">
  <input type="checkbox" class="toggle-input" name="italic">
  Italic
</label>

<!-- <sl:toggle name="starred" value="yes" checked class="ms-2" x-on:change="save"><sl:icon name="star"/> Star</sl:toggle> -->
<label class="toggle ms-2">
  <input type="checkbox" class="toggle-input" name="starred" value="yes" checked x-on:change="save">
  <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  Star
</label>

<!-- <sl:toggle name="pinned" disabled aria-invalid="true">Pin</sl:toggle> -->
<label class="toggle">
  <input type="checkbox" class="toggle-input" name="pinned" disabled aria-invalid="true">
  Pin
</label>
