<div class="tabs" x-data="slTabs" id="settings">
  <div class="tabs-list" role="tablist" aria-label="Settings">
    <button type="button" class="tabs-trigger" role="tab" id="settings-account-trigger" aria-controls="settings-account-content" aria-selected="true">Account</button>
    <button type="button" class="tabs-trigger" role="tab" id="settings-password-trigger" aria-controls="settings-password-content" aria-selected="false">Password</button>
    <button type="button" class="tabs-trigger" role="tab" id="settings-billing-trigger" aria-controls="settings-billing-content" aria-selected="false" disabled>Billing</button>
  </div>
  <div class="tabs-content" role="tabpanel" tabindex="0" id="settings-account-content" aria-labelledby="settings-account-trigger">Account settings</div>
  <div class="tabs-content" role="tabpanel" tabindex="0" id="settings-password-content" aria-labelledby="settings-password-trigger" hidden>Password settings</div>
  <div class="tabs-content" role="tabpanel" tabindex="0" id="settings-billing-content" aria-labelledby="settings-billing-trigger" hidden>Billing settings</div>
</div>

<div class="tabs wide" x-data="slTabs" id="report" data-orientation="vertical" data-activation="manual">
  <div class="tabs-list" role="tablist" aria-orientation="vertical" data-variant="line">
    <a class="tabs-trigger" role="tab" id="report-overview-trigger" aria-controls="report-overview-content" aria-selected="false" href="?tab=overview">Overview</a>
    <a class="tabs-trigger" role="tab" id="report-analytics-trigger" aria-controls="report-analytics-content" aria-selected="true" href="?tab=analytics">Analytics</a>
    <a class="tabs-trigger" role="tab" id="report-reports-trigger" aria-controls="report-reports-content" aria-selected="false" aria-disabled="true">Reports</a>
  </div>
  <div class="tabs-content" role="tabpanel" tabindex="0" id="report-overview-content" aria-labelledby="report-overview-trigger" hidden>Overview</div>
  <div class="tabs-content" role="tabpanel" tabindex="0" id="report-analytics-content" aria-labelledby="report-analytics-trigger" hx-get="/analytics" hx-trigger="sl-tabs-show once">…</div>
  <div class="tabs-content" role="tabpanel" tabindex="0" id="report-reports-content" aria-labelledby="report-reports-trigger" hidden>Reports</div>
</div>
