<dialog class="sheet" id="edit-profile" closedby="any" x-data="slDialog" aria-labelledby="edit-profile-title" aria-describedby="edit-profile-description">
  <div class="sheet-header">
    <div class="sheet-title" role="heading" aria-level="2" id="edit-profile-title">Edit profile</div>
