  <sl:select-group label="Fruits">

<div class="select-wrapper w-full" x-data="slSelect">
  <select class="select" id="fruit" name="fruit" required>
    <button type="button">
      <selectedcontent></selectedcontent>
    </button>
    <option class="select-item" value="" hidden data-placeholder="true">Select a fruit</option>
    <optgroup class="select-group" label="Fruits">
      <option class="select-item" value="apple">
        Apple
        <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon select-item-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
      </option>
      <option class="select-item" value="banana" disabled>
        Banana
        <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon select-item-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
      </option>
    </optgroup>
    <hr class="select-separator">
    <optgroup class="select-group" label="Vegetables">
      <option class="select-item" value="carrot" selected>
        Carrot
        <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon select-item-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
      </option>
    </optgroup>
  </select>
  <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon select-icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  <template class="select-indicator-template">
    <svg xmlns="http://www.w3.org/2000/svg" class="sl-icon select-item-indicator" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"></svg>
  </template>
</div>
