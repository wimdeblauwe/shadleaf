<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<!-- Test-only component: enum, boolean, number and string props, rendered through props and sl:attrs. -->
<head>
  <sl:props>
    <sl:prop name="variant" default="neutral" values="neutral success danger">Colour of the chip.</sl:prop>
    <sl:prop name="size" default="md" values="sm md lg">Size of the chip.</sl:prop>
    <sl:prop name="removable" type="boolean">Show a remove button.</sl:prop>
    <sl:prop name="count" type="number">Optional counter.</sl:prop>
    <sl:prop name="label">Text shown before the content.</sl:prop>
  </sl:props>
</head>
<body>
<span th:fragment="test-chip"
      class="chip"
      th:attr="data-variant=${props.unlessDefault('variant')},
               data-size=${props.unlessDefault('size')},
               data-removable=${props.removable ? 'true' : null},
               data-count=${props.count}"
      sl:attrs><b th:if="${props.label != null}" th:text="${props.label}"></b><sl:slot>Chip</sl:slot></span>
</body>
</html>
