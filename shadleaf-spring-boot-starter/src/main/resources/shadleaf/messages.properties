# Built-in strings of the Shadleaf components. An application rewords or translates one by defining the same key in
# its own messages.properties (or messages_<locale>.properties): its MessageSource is asked first.
sl.button.loading=Loading
sl.form-errors.title=There is a problem
sl.dialog.close=Close
sl.alert-dialog.cancel=Cancel
