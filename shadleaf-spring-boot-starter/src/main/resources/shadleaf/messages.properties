# Built-in strings of the Shadleaf components. An application rewords or translates one by defining the same key in
# its own messages.properties (or messages_<locale>.properties): its MessageSource is asked first.
#
# Every messages_<language>.properties next to this file has exactly these keys (ShadleafMessageBundlesTest). A message
# with arguments ({0}) is a MessageFormat pattern, so an apostrophe in it is written twice (''); one without arguments
# is used as written. The comments below are on the docs' Translating page, above the key they precede.

