<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
  Public entry points for consuming applications.

  Usage in a consumer template:
    <head>
      <th:block th:replace="~{sl/layout :: theme-script}"></th:block>
      <th:block th:replace="~{sl/layout :: assets}"></th:block>
    </head>

  Fragments are never named after an HTML element: `head` would also match the <head> element in this template.
-->
<head>
  <th:block th:fragment="assets">
    <th:block th:if="${@shadleafAssets.devMode}">
      <script type="module" th:with="viteClientUrl=${@shadleafAssets.viteClientUrl}"
              th:src="${viteClientUrl}"></script>
    </th:block>
    <link rel="stylesheet" th:with="url=${@shadleafAssets.cssUrl}" th:href="@{${url}}"/>
  </th:block>

  <!--
    Sets class="dark" on <html> before the first paint. Place it early in <head>, before the stylesheet.
    Carries the request's CSP nonce when there is one (shadleaf.csp.nonce-attribute); otherwise allow it with
    ShadleafThemeScript#getCspHash(). Both lookups go through th:with: Thymeleaf forbids @bean and #ctx in th:attr.
  -->
  <script th:fragment="theme-script"
          th:with="themeScript=${@shadleafThemeScript},
                   nonce=${#ctx.getVariable(themeScript.nonceAttribute)}"
          th:attr="nonce=${nonce}"
          th:utext="${themeScript.content}"></script>
</head>
<body>
</body>
</html>
