<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The title of an alert, inside <code>sl:alert</code>.</sl:description>
    <sl:prop name="level" values="1 2 3 4 5 6">Heading level. With it the title is a heading
      (<code>role="heading"</code> and <code>aria-level</code>) that screen reader users can jump to; without it,
      plain text, as in shadcn/ui.</sl:prop>
  </sl:props>
</head>
<body>
<div th:fragment="alert-title"
     class="alert-title"
     th:attr="role=${props.level != null ? 'heading' : null},
              aria-level=${props.level}"
     sl:attrs><sl:slot/></div>
</body>
</html>
