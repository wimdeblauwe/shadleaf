<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The title of a <code>sl:sheet</code>, inside <code>sl:sheet-header</code>: a heading that names
      the sheet (<code>aria-labelledby</code>). Its id derives from the sheet's
      (<code>filters-title</code>).</sl:description>
    <sl:prop name="level" default="2" values="1 2 3 4 5 6">Heading level (<code>role="heading"</code> and
      <code>aria-level</code>). A sheet starts an outline of its own, so the default, 2, rarely needs
      changing.</sl:prop>
  </sl:props>
</head>
<body>
<!--/* A div with role="heading", as sl:dialog-title. */-->
<div th:fragment="sheet-title"
     class="sheet-title"
     role="heading"
     th:attr="aria-level=${props.level},
              id=${slDialogId != null ? slDialogId + '-title' : null}"
     sl:attrs><sl:slot/></div>
</body>
</html>
