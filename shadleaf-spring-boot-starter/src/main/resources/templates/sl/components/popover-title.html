<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The title of a <code>sl:popover</code>, inside <code>sl:popover-header</code>, which names the
      popover (<code>aria-labelledby</code>). Its id derives from the popover's
      (<code>dimensions-title</code>).</sl:description>
    <sl:prop name="level" values="1 2 3 4 5 6">Heading level. With it the title is a heading
      (<code>role="heading"</code> and <code>aria-level</code>); without it, plain text, as in shadcn/ui.</sl:prop>
  </sl:props>
</head>
<body>
<div th:fragment="popover-title"
     class="popover-title"
     th:attr="role=${props.level != null ? 'heading' : null},
              aria-level=${props.level},
              id=${slPopoverId != null ? slPopoverId + '-title' : null}"
     sl:attrs><sl:slot/></div>
</body>
</html>
