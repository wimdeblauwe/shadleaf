<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The name of a <code>sl:sidebar-group</code>, in small muted text above its menu. The group is
      labelled by it, so it gets an id from the group (<code>&lt;group id&gt;-label</code>); give the group an
      <code>id</code> rather than the label.</sl:description>
  </sl:props>
</head>
<body>
<!--/* A div, not a heading: the group's role="group" carries the name (see sl:sidebar-group). */-->
<div th:fragment="sidebar-group-label"
     class="sidebar-group-label"
     th:attr="id=${slSidebarGroupLabelId}"
     sl:attrs><sl:slot/></div>
</body>
</html>
