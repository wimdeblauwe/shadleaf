<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The bottom of a <code>sl:alert-dialog</code>, for <code>sl:alert-dialog-cancel</code> and the
      action: side by side at the end on a wide screen, stacked with the first one at the bottom on a narrow one, and
      two equal columns in a small dialog.</sl:description>
  </sl:props>
</head>
<body>
<div th:fragment="alert-dialog-footer" class="alert-dialog-footer" sl:attrs><sl:slot/></div>
</body>
</html>
