<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>Stacks a <code>sl:field-label</code> with its <code>sl:field-description</code> or
      <code>sl:field-error</code>, beside the control of a horizontal <code>sl:field</code>.</sl:description>

</head>
<body>
<div th:fragment="field-content" class="field-content" sl:attrs><sl:slot/></div>
</body>
</html>
