<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>Supporting text below a <code>sl:dialog-title</code>, which describes the dialog
      (<code>aria-describedby</code>). Its id derives from the dialog's
      (<code>edit-profile-description</code>).</sl:description>
  </sl:props>
</head>
<body>
<div th:fragment="dialog-description"
     class="dialog-description"
     th:attr="id=${slDialogId != null ? slDialogId + '-description' : null}"
     sl:attrs><sl:slot/></div>
</body>
</html>
