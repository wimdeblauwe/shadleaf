<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The bottom of a <code>sl:dialog</code>, for its actions: side by side at the end on a wide
      screen, stacked with the first one at the bottom on a narrow one.</sl:description>
    <sl:prop name="close-button" type="boolean">An outline "Close" button after the other actions.</sl:prop>
  </sl:props>
</head>
<body>
<div th:fragment="dialog-footer" class="dialog-footer" sl:attrs><sl:slot/><sl:button
    th:if="${props['close-button']}"
    variant="outline"
    th:commandfor="${slDialogId}"
    command="close"
    th:text="#{sl.dialog.close}"/></div>
</body>
</html>
