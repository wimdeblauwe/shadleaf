<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>Supporting text below a <code>sl:alert-dialog-title</code>, which describes the dialog
      (<code>aria-describedby</code>): what happens, and whether it can be undone. Its id derives from the dialog's
      (<code>delete-account-description</code>).</sl:description>
  </sl:props>
</head>
<body>
<div th:fragment="alert-dialog-description"
     class="alert-dialog-description"
     th:attr="id=${slDialogId != null ? slDialogId + '-description' : null}"
     sl:attrs><sl:slot/></div>
</body>
</html>
