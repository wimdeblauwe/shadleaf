<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The content of a <code>sl:accordion-item</code>, shown while it is open. Find-in-page searches it
      while it is closed, and opens the section on a match.</sl:description>
  </sl:props>
</head>
<body>
<!--/* Nothing for a closed disabled item: find-in-page would open it. */-->
<div th:fragment="accordion-content"
     th:unless="${slAccordionItemHidden == true}"
     class="accordion-content"
     sl:attrs><sl:slot/></div>
</body>
</html>
