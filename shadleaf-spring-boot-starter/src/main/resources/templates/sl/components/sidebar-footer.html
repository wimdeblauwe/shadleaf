<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sl="https://shadleaf.dev/sl">
<head>
  <sl:props>
    <sl:description>The bottom of the <code>sl:sidebar</code>: settings, help or the signed-in user, below the
      <code>sl:sidebar-content</code>. It does not scroll with the content.</sl:description>
    <sl:prop name="panel-only" type="boolean">Show it only in the phone panel: from 768&nbsp;px it is left out
      (<code>display: none</code>), so a header row or a sidebar stays short.</sl:prop>
  </sl:props>
</head>
<body>
<div th:fragment="sidebar-footer"
     class="sidebar-footer"
     th:attr="data-panel-only=${props['panel-only'] ? 'true' : null}"
     sl:attrs><sl:slot/></div>
</body>
</html>
