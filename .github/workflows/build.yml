name: Build

on:
  push:
  pull_request:
  # The release workflow runs it on main after setting the next development version.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and install the library
        run: mvn -B install

      # Written by PreviewGeneratorTest during the build above; the docs job builds the site from it.
      - name: Keep the generated docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-docs
          path: shadleaf-spring-boot-starter/target/generated-docs/
          if-no-files-found: error
          retention-days: 7

      - name: Build sample 1 against the installed library
        run: mvn -B verify
        working-directory: samples/shadleaf-sample-01

      - name: Build the Spring Security + CSP sample against the installed library
        run: mvn -B verify
        working-directory: samples/shadleaf-sample-02

  docs:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: generated-docs
          path: shadleaf-spring-boot-starter/target/generated-docs/

      # pnpm, Node.js and `pnpm install --frozen-lockfile` in docs/, with the pnpm store cached on the lockfile.
      - uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@24
          working-directory: docs
          require-lockfile: true
          cache: true
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build the docs site
        run: pnpm run build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # axe-core and the keyboard focus pass over the showcase page, in every skin, light and dark
      - name: Check the showcase's accessibility
        run: pnpm test

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 14

  # Every push to main publishes the docs of its SNAPSHOT to gh-pages (/shadleaf/<version>/), once the
  # accessibility checks passed. Releases also move /shadleaf/current/ (release.yml calls publish-docs.yml too).
  publish-docs:
    needs: docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      generated-docs-artifact: generated-docs

  # Every build of main recreates the early-access pre-release on the GitHub releases page: the `early-access` tag moves
  # to this commit and the notes list every conventional commit since the last release, i.e. what the next release
  # would contain. No versions change and nothing goes to Maven Central.
  early-access:
    needs: docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: early-access
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # JReleaser only makes an early-access release of a SNAPSHOT; a release version would be released for real.
      - name: Check for a SNAPSHOT version
        id: version
        run: |
          version=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-SNAPSHOT ]] || echo "::notice::$version is not a SNAPSHOT: no early-access release"

      - name: Update the early-access release
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -N jreleaser:release

      - name: Keep the JReleaser output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-early-access
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties
            target/jreleaser/release/CHANGELOG.md
          if-no-files-found: ignore
          retention-days: 7
