name: Build

on:
  # main only: a branch with a pull request is built by the pull_request event, which would otherwise run it twice.
  push:
    branches: [main]
  pull_request:
  # The release workflow runs it on main after setting the next development version.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and install the library
        run: mvn -B install

      # Written by PreviewGeneratorTest during the build above; the docs job builds the site from it.
      - name: Keep the generated docs artifacts
        uses: actions/upload-artifact@v7
        with:
          name: generated-docs
          path: shadleaf-spring-boot-starter/target/generated-docs/
          if-no-files-found: error
          retention-days: 7

      - name: Build sample 1 against the installed library
        run: mvn -B verify
        working-directory: samples/shadleaf-sample-01

      - name: Build the Spring Security + CSP sample against the installed library
        run: mvn -B verify
        working-directory: samples/shadleaf-sample-02

      # Its tests start Keycloak with Testcontainers (Docker is on the runner).
      - name: Build the OAuth2 login sample against the installed library
        run: mvn -B verify
        working-directory: samples/shadleaf-sample-03

  # The browser tests in three shards side by side; docs-report merges their reports into one.
  docs:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: generated-docs
          path: shadleaf-spring-boot-starter/target/generated-docs/

      # pnpm, Node.js and `pnpm install --frozen-lockfile` in docs/, with the pnpm store cached on the lockfile.
      - uses: pnpm/setup@v3
        with:
          version: 12.14.0
          runtime: node@24
          working-directory: docs
          require-lockfile: true
          cache: true
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Build the docs site
        run: pnpm run build

      - name: Find the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      # The browser is cached per Playwright version; the system packages it needs are installed every time.
      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Chromium and the default skin only; `pnpm run test:full` adds Firefox and every skin, run it locally.
      - name: Install Chromium for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium

      - name: Install Chromium's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # axe-core and the keyboard focus pass over the showcase page, in the default skin, light and dark
      - name: Check the showcase's accessibility
        run: pnpm test -- --shard=${{ matrix.shard }}/3

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.shard }}
          path: docs/blob-report/
          retention-days: 1

  docs-report:
    needs: docs
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          version: 12.14.0
          runtime: node@24
          working-directory: docs
          require-lockfile: true
          cache: true
          cache-dependency-path: docs/pnpm-lock.yaml

      - uses: actions/download-artifact@v8
        with:
          pattern: blob-report-*
          path: docs/all-blob-reports/
          merge-multiple: true

      - name: Merge the shards' reports
        run: pnpm exec playwright merge-reports --reporter html ./all-blob-reports

      - uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 14

  # Every push to main publishes the docs of its SNAPSHOT to gh-pages (/<version>/), once the
  # accessibility checks passed. Releases also move /current/ (release.yml calls publish-docs.yml too).
  publish-docs:
    needs: docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/publish-docs.yml
    with:
      generated-docs-artifact: generated-docs

  # Every build of main recreates the snapshot pre-release on the GitHub releases page: its tag (the pom's version, e.g.
  # 0.3.0-SNAPSHOT) moves to this commit and the notes list every conventional commit since the last release, i.e. what the next release
  # would contain. No versions change and nothing goes to Maven Central.
  early-access:
    needs: docs
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: early-access
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # JReleaser only makes a pre-release of a SNAPSHOT; a release version would be released for real.
      - name: Check for a SNAPSHOT version
        id: version
        run: |
          version=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          [[ "$version" == *-SNAPSHOT ]] || echo "::notice::$version is not a SNAPSHOT: no snapshot pre-release"

      - name: Update the snapshot pre-release
        if: endsWith(steps.version.outputs.version, '-SNAPSHOT')
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -N jreleaser:release

      - name: Keep the JReleaser output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jreleaser-early-access
          path: |
            target/jreleaser/trace.log
            target/jreleaser/output.properties
            target/jreleaser/release/CHANGELOG.md
          if-no-files-found: ignore
          retention-days: 7
