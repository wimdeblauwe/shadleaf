name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and install the library
        run: mvn -B install

      # Written by PreviewGeneratorTest during the build above; the docs job builds the site from it.
      - name: Keep the generated docs artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: shadleaf-spring-boot-starter/target/generated-docs/
          if-no-files-found: error
          retention-days: 7

      - name: Build sample 1 against the installed library
        run: mvn -B verify
        working-directory: samples/shadleaf-sample-01

      - name: Build the Spring Security + CSP sample against the installed library
        run: mvn -B verify
        working-directory: samples/shadleaf-sample-02

  docs:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: generated-docs
          path: shadleaf-spring-boot-starter/target/generated-docs/

      - uses: pnpm/action-setup@v4
        with:
          version: 11.13.0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build the docs site
        run: pnpm run build

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      # axe-core and the keyboard focus pass over the showcase page, in every skin, light and dark
      - name: Check the showcase's accessibility
        run: pnpm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: docs/playwright-report/
          retention-days: 14
