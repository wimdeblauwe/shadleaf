name: Publish docs

# Publishes the docs site to the gh-pages branch, one directory per version, served as a GitHub project page:
#   https://wimdeblauwe.github.io/shadleaf/<version>/   every release, and the SNAPSHOT of every push to main
#   https://wimdeblauwe.github.io/shadleaf/current/     the newest release
# The site root redirects to current/ (to the published version until there is a release). GitHub Pages must be set
# to deploy from the gh-pages branch, root folder.
# The Build workflow calls this after its docs job passed on main, and the Release workflow after a release, both
# handing over the previews they already rendered. (Not on `release: published`: a release made with the GITHUB_TOKEN,
# as JReleaser's is, never triggers a workflow.)
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      generated-docs-artifact:
        description: Name of an artifact of the calling run holding target/generated-docs; rendered here when empty
        type: string
        default: ''
      ref:
        description: The commit, branch or tag to build the site from; the calling run's commit when empty
        type: string
        default: ''

permissions:
  contents: write

env:
  # The repository name: the path GitHub serves a project page under.
  SITE_PATH: /shadleaf

jobs:
  publish:
    runs-on: ubuntu-latest
    # Job level, not workflow level: as a called workflow, a workflow-level group would be shared with the caller.
    concurrency:
      group: publish-docs
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/download-artifact@v8
        if: inputs.generated-docs-artifact != ''
        with:
          name: ${{ inputs.generated-docs-artifact }}
          path: shadleaf-spring-boot-starter/target/generated-docs/

      - uses: actions/setup-java@v6
        if: inputs.generated-docs-artifact == ''
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Render the previews
        if: inputs.generated-docs-artifact == ''
        run: mvn -B -pl shadleaf-spring-boot-starter -Dtest=PreviewGeneratorTest -Dsurefire.failIfNoSpecifiedTests=false test

      # PreviewGeneratorTest stamps previews.json with the project version.
      - name: Determine the version
        id: version
        run: |
          version=$(jq -r '.version // empty' shadleaf-spring-boot-starter/target/generated-docs/previews.json)
          : "${version:?could not read the version from previews.json}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # pnpm, Node.js and `pnpm install --frozen-lockfile` in docs/, with the pnpm store cached on the lockfile.
      - uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@24
          working-directory: docs
          require-lockfile: true
          cache: true
          cache-dependency-path: docs/pnpm-lock.yaml

      - name: Check out gh-pages
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git fetch --depth 1 origin gh-pages
            git worktree add gh-pages FETCH_HEAD
            git -C gh-pages switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages gh-pages
          fi

      - name: Decide whether current/ moves
        id: current
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nocasematch
          if [[ "$VERSION" == *-snapshot* || "$VERSION" == *-rc* || "$VERSION" == *-m* ]]; then
            echo "Pre-release $VERSION: current/ stays"
            echo "update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(find gh-pages -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          if [[ -n "$latest" && "$(printf '%s\n%s\n' "$latest" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]]; then
            echo "$VERSION is older than $latest: current/ stays"
            echo "update=false" >> "$GITHUB_OUTPUT"
          else
            echo "update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and copy the versioned site
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd docs && DOCS_BASE="$SITE_PATH/$VERSION" pnpm run build)
          rm -rf "gh-pages/$VERSION"
          cp -r docs/dist "gh-pages/$VERSION"

      - name: Build and copy current/
        if: steps.current.outputs.update == 'true'
        run: |
          (cd docs && DOCS_BASE="$SITE_PATH/current" pnpm run build)
          rm -rf gh-pages/current
          cp -r docs/dist gh-pages/current

      - name: Root redirect and .nojekyll
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Without .nojekyll, GitHub Pages drops Astro's _astro/ directory.
          touch gh-pages/.nojekyll
          # Before the first release there is no current/: point at the version just published.
          target=current/
          [[ -d gh-pages/current ]] || target="$VERSION/"
          cat > gh-pages/index.html <<HTML
          <!doctype html>
          <meta charset="utf-8">
          <title>Shadleaf</title>
          <meta http-equiv="refresh" content="0; url=$target">
          <link rel="canonical" href="$target">
          <a href="$target">Shadleaf documentation</a>
          HTML

      - name: Commit and push
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "docs: publish $VERSION"
          git push origin gh-pages
