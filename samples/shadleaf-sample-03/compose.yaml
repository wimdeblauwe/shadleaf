# Keycloak for `mvn spring-boot:run` (spring-boot-docker-compose starts it with the application). The realm, its client
# and two users (ada and grace, password "password") come from keycloak/shadleaf-realm.json.
# Admin console: http://localhost:8180 (admin / admin).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/shadleaf-realm.json:/opt/keycloak/data/import/shadleaf-realm.json:ro
    # The application reads Keycloak's discovery document at startup, so it waits for this, not just the open port.
    # The image has no curl: bash's /dev/tcp asks the management port's readiness endpoint.
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 2s
      timeout: 2s
      retries: 60
