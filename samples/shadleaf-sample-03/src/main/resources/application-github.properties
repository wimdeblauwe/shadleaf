# GitHub as a second way to sign in: register an OAuth app at https://github.com/settings/developers with the
# callback URL http://localhost:8080/login/oauth2/code/github, then run with
#   GITHUB_CLIENT_ID=... GITHUB_CLIENT_SECRET=... mvn spring-boot:run -Dspring-boot.run.profiles=github
# Spring Security knows GitHub's endpoints; the default scope (read:user) is enough for the name, login and picture.
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.client-name=GitHub
