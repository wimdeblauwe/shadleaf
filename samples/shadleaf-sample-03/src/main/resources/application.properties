spring.application.name=Shadleaf Sample App 3

# Keycloak from compose.yaml (the tests start their own and override these). Spring Security reads the provider's
# endpoints, its end-session endpoint included, from the issuer's discovery document at startup.
spring.security.oauth2.client.registration.keycloak.client-id=shadleaf-sample
spring.security.oauth2.client.registration.keycloak.client-secret=shadleaf-sample-secret
spring.security.oauth2.client.registration.keycloak.client-name=Keycloak
spring.security.oauth2.client.registration.keycloak.scope=openid,profile,email
spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8180/realms/shadleaf
