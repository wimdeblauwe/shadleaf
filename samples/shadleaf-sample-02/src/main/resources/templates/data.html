<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/main :: layout('Data', ~{::#page-content})}">
<body>
<div id="page-content">
  <sl:tabs id="data" th:active="${tab}">
    <sl:tabs-list aria-label="Data">
      <sl:tabs-trigger tab="projects" th:href="@{/data(tab='projects')}">Projects</sl:tabs-trigger>
      <sl:tabs-trigger tab="about" th:href="@{/data(tab='about')}">About</sl:tabs-trigger>
    </sl:tabs-list>
    <sl:tabs-content tab="projects">
      <!--/* Only for admins, like the Admin link in the header. Hiding it is a courtesy; /admin/** refuses everyone else. */-->
      <div class="row" sec:authorize="hasRole('ADMIN')">
        <sl:button as="a" th:href="@{/admin}" variant="outline" size="sm" id="manage-access">
          <sl:slot name="icon-start"><sl:icon name="shield"/></sl:slot>
          Manage access
        </sl:button>
      </div>
      <sl:table>
        <caption class="visually-hidden">Projects</caption>
        <thead>
        <tr>
          <th scope="col">Name</th>
          <th scope="col">Status</th>
          <th scope="col" data-align="end">Members</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="project : ${projects}">
          <td th:text="${project.name}">Marketing site</td>
          <td><sl:badge th:variant="${project.active ? 'default' : 'secondary'}"
                        th:text="${project.active ? 'Active' : 'Archived'}">Active</sl:badge></td>
          <td data-align="end" th:text="${project.members}">4</td>
        </tr>
        </tbody>
      </sl:table>
    </sl:tabs-content>
    <!--/* Loaded with htmx the first time it is shown, unless the server rendered it as the active tab. */-->
    <sl:tabs-content tab="about" th:hx-get="${tab != 'about'} ? @{/data/about}" hx-trigger="sl-tabs-show once">
      <th:block th:if="${tab == 'about'}" th:insert="~{data :: about}"></th:block>
    </sl:tabs-content>
  </sl:tabs>
</div>
<th:block th:fragment="about">
  <p>Tabs whose triggers are links: without JavaScript each loads the page with its tab active. This panel is loaded
    with htmx the first time it is shown, from <code>/data/about</code>.</p>
</th:block>
</body>
</html>
