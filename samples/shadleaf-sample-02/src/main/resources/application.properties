spring.application.name=Shadleaf Sample App 2

# Sign in with user / password
spring.security.user.name=user
spring.security.user.password=password

# nonce (a fresh nonce per request) or hash (a fixed policy with ShadleafThemeScript#getCspHash())
sample.csp.mode=nonce

# The policy has no 'unsafe-eval', so the page loads Alpine's CSP build
shadleaf.assets.alpine=csp
