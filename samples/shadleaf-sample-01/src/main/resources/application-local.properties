spring.thymeleaf.cache=false
spring.web.resources.chain.cache=false

shadleaf.dev.vite-server-url=http://localhost:5174
shadleaf.dev.templates-path=../../shadleaf-spring-boot-starter/src/main/resources/templates/
# IDE completion for <sl:*> tags, picked up through "web-types" in package.json
shadleaf.dev.web-types-file=shadleaf.web-types.json

vite.mode=dev
# The person page's upload answers 2 seconds late, so its files show "Processing" after the upload (PeopleController).
# The percentages before it go by fast on localhost: throttle the network in the browser's developer tools to see them.
sample.upload-processing-delay=2s
