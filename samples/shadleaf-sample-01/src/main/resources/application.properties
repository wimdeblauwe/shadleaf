spring.application.name=Shadleaf Sample App 1
vite.mode=build
# The people page's rows live in an in-memory H2 database, generated at startup (PeopleData).
spring.jpa.open-in-view=false
# The person page's upload form takes files up to 5 MB and says so itself (PeopleController): the limits are higher,
# so a larger file reaches that check instead of failing the request.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# The session id travels in a cookie only: without this, the first redirect that creates a session (a toast in a flash
# attribute) puts ;jsessionid=... in the URL, and htmx pushes it into the history.
server.servlet.session.tracking-modes=cookie
