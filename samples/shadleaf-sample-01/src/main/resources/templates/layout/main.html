<!DOCTYPE html>
<html th:lang="|${#locale.language}-${#locale.country}|"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      th:fragment="layout(pageTitle, breadcrumb, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${pageTitle} - Shadleaf Sample App 1|">Shadleaf Sample App 1</title>
  <th:block th:replace="~{sl/layout :: theme-script}"></th:block>
  <th:block th:replace="~{sl/layout :: assets}"></th:block>
  <!--/* htmx from its webjar (version in the pom), so it comes from our own origin. The config keeps it within a
    strict CSP: no inline <style> for the request indicator, and no eval (hx-on, js: values), which this app does not
    use. */-->
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false}'>
  <script th:src="@{/webjars/htmx.org/dist/htmx.min.js}" defer></script>
  <vite:client></vite:client>
  <vite:vite>
    <vite:entry value="/css/application.css"></vite:entry>
  </vite:vite>
</head>
<!--/* hx-boost on the body: every link and form htmx does not handle otherwise loads the next page with htmx and swaps
  the whole body, so the server renders the current page in the sidebar, the breadcrumb and the sidebar's state (its
  cookie) every time. Controllers that answer htmx with a fragment tell such a request apart (HtmxRequests). */-->
<body hx-boost="true">
<sl:skip-link/>
<!--/* shadcn/ui's sidebar-07, with the inset variant: the page is a card on the sidebar's ground from 768 px, and the
  sidebar collapses to a strip of icons whose tooltips show the labels; below 768 px the sidebar is a panel the trigger
  opens. */-->
<sl:sidebar-provider>
  <sl:sidebar variant="inset" collapsible="icon">
    <sl:sidebar-header>
      <sl:sidebar-menu>
        <sl:sidebar-menu-item>
          <sl:sidebar-menu-button th:href="@{/}" size="lg" tooltip="Shadleaf">
            <sl:slot name="icon-start"><span class="app-logo"><sl:icon name="leaf"/></span></sl:slot>
            <strong>Shadleaf</strong>
            <small>Sample app 1</small>
          </sl:sidebar-menu-button>
        </sl:sidebar-menu-item>
      </sl:sidebar-menu>
    </sl:sidebar-header>
    <sl:sidebar-content>
      <sl:sidebar-group id="nav-basics">
        <sl:sidebar-group-label>Basics</sl:sidebar-group-label>
        <sl:sidebar-group-content>
          <sl:sidebar-menu>
            <sl:sidebar-menu-item>
              <sl:sidebar-menu-button th:href="@{/}" th:active="${#slNav.current('/')}"
                                      tooltip="Buttons">
                <sl:slot name="icon-start"><sl:icon name="mouse-pointer-click"/></sl:slot>
                Buttons
              </sl:sidebar-menu-button>
            </sl:sidebar-menu-item>
          </sl:sidebar-menu>
        </sl:sidebar-group-content>
      </sl:sidebar-group>
      <sl:sidebar-group id="nav-forms">
        <sl:sidebar-group-label>Forms</sl:sidebar-group-label>
        <sl:sidebar-group-content>
          <sl:sidebar-menu>
            <sl:sidebar-menu-item>
              <sl:sidebar-menu-button th:href="@{/form}" th:active="${#slNav.current('/form')}"
                                      tooltip="Form">
                <sl:slot name="icon-start"><sl:icon name="file-text"/></sl:slot>
                Form
              </sl:sidebar-menu-button>
            </sl:sidebar-menu-item>
            <sl:sidebar-menu-item>
              <sl:sidebar-menu-button th:href="@{/htmx-form}" th:active="${#slNav.current('/htmx-form')}"
                                      tooltip="Form with htmx">
                <sl:slot name="icon-start"><sl:icon name="zap"/></sl:slot>
                Form with htmx
              </sl:sidebar-menu-button>
            </sl:sidebar-menu-item>
          </sl:sidebar-menu>
        </sl:sidebar-group-content>
      </sl:sidebar-group>
      <sl:sidebar-group id="nav-interactive">
        <sl:sidebar-group-label>Interactive</sl:sidebar-group-label>
        <sl:sidebar-group-content>
          <sl:sidebar-menu>
            <sl:sidebar-menu-item>
              <sl:sidebar-menu-button th:href="@{/dialog}" th:active="${#slNav.current('/dialog')}"
                                      tooltip="Dialog">
                <sl:slot name="icon-start"><sl:icon name="app-window"/></sl:slot>
                Dialog
              </sl:sidebar-menu-button>
            </sl:sidebar-menu-item>
            <sl:sidebar-menu-item>
              <sl:sidebar-menu-button th:href="@{/settings}" th:active="${#slNav.current('/settings')}"
                                      tooltip="Settings">
                <sl:slot name="icon-start"><sl:icon name="settings"/></sl:slot>
                Settings
              </sl:sidebar-menu-button>
            </sl:sidebar-menu-item>
          </sl:sidebar-menu>
        </sl:sidebar-group-content>
      </sl:sidebar-group>
      <sl:sidebar-group id="nav-tables">
        <sl:sidebar-group-label>Tables</sl:sidebar-group-label>
        <sl:sidebar-group-content>
          <sl:sidebar-menu>
            <!--/* The three people pages under one collapsible item, open on any of them. /people also marks the
              person pages below it (/people/12). */-->
            <sl:sidebar-menu-item collapsible
                                  th:open="${#slNav.current('/people') or #slNav.current('/people-multiselect')
                                             or #slNav.current('/people-load-more')}">
              <sl:sidebar-menu-button tooltip="People">
                <sl:slot name="icon-start"><sl:icon name="users"/></sl:slot>
                People
              </sl:sidebar-menu-button>
              <sl:sidebar-menu-sub>
                <sl:sidebar-menu-sub-item>
                  <sl:sidebar-menu-sub-button th:href="@{/people}" th:active="${#slNav.current('/people')}">
                    All people
                  </sl:sidebar-menu-sub-button>
                </sl:sidebar-menu-sub-item>
                <sl:sidebar-menu-sub-item>
                  <sl:sidebar-menu-sub-button th:href="@{/people-multiselect}"
                                              th:active="${#slNav.current('/people-multiselect')}">
                    With multiselect
                  </sl:sidebar-menu-sub-button>
                </sl:sidebar-menu-sub-item>
                <sl:sidebar-menu-sub-item>
                  <sl:sidebar-menu-sub-button th:href="@{/people-load-more}"
                                              th:active="${#slNav.current('/people-load-more')}">
                    Load more
                  </sl:sidebar-menu-sub-button>
                </sl:sidebar-menu-sub-item>
              </sl:sidebar-menu-sub>
            </sl:sidebar-menu-item>
          </sl:sidebar-menu>
        </sl:sidebar-group-content>
      </sl:sidebar-group>
    </sl:sidebar-content>
    <sl:sidebar-footer>
      <sl:sidebar-menu>
        <sl:sidebar-menu-item>
          <sl:sidebar-menu-button href="https://wimdeblauwe.github.io/shadleaf/" size="sm" tooltip="Documentation">
            <sl:slot name="icon-start"><sl:icon name="book-open"/></sl:slot>
            Documentation
          </sl:sidebar-menu-button>
        </sl:sidebar-menu-item>
      </sl:sidebar-menu>
    </sl:sidebar-footer>
  </sl:sidebar>
  <sl:sidebar-inset>
    <!--/* The page header: the trigger, a separator and the page's breadcrumb (the levels are the page's own, passed in
      as a fragment), with the theme toggle at the end. */-->
    <header class="inset-header">
      <sl:sidebar-trigger/>
      <sl:separator orientation="vertical"/>
      <sl:breadcrumb>
        <sl:breadcrumb-list>
          <th:block th:replace="${breadcrumb}"></th:block>
        </sl:breadcrumb-list>
      </sl:breadcrumb>
      <div class="inset-header-end">
        <sl:theme-toggle/>
      </div>
    </header>
    <div class="page">
      <h1 th:text="${pageTitle}"></h1>
      <div th:replace="${content}"></div>
    </div>
  </sl:sidebar-inset>
</sl:sidebar-provider>
<!--/* Where htmx puts a dialog the server renders (the dialog page's edit dialog). */-->
<div id="modal-root"></div>
<!--/* The toasts: those a controller put in the toasts flash attribute before a redirect (the form page), those an htmx
  response sends with HX-Trigger: sl-toast (a delete on the dialog page), and those it swaps in out of band (an
  invite). */-->
<sl:toaster>
  <sl:toast th:each="toast : ${toasts}" th:title="${toast.title}" th:description="${toast.description}"
            th:variant="${toast.variant}" th:duration="${toast.duration}"/>
</sl:toaster>
</body>
</html>
