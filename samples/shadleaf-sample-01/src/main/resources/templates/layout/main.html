<!DOCTYPE html>
<html th:lang="|${#locale.language}-${#locale.country}|"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sl="https://shadleaf.dev/sl"
      th:fragment="layout(pageTitle, content)">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${pageTitle} - Shadleaf Sample App 1|">Shadleaf Sample App 1</title>
  <th:block th:replace="~{sl/layout :: theme-script}"></th:block>
  <th:block th:replace="~{sl/layout :: assets}"></th:block>
  <vite:client></vite:client>
  <vite:vite>
    <vite:entry value="/css/application.css"></vite:entry>
    <vite:entry value="/js/theme-toggle.js"></vite:entry>
  </vite:vite>
</head>
<body>
<main>
  <header class="page-header">
    <h1 th:text="${pageTitle}"></h1>
    <div class="theme-toggle" role="group" aria-label="Theme">
      <sl:button variant="outline" size="sm" data-theme-choice="light">
        <sl:slot name="icon-start"><sl:icon name="sun"/></sl:slot>Light</sl:button>
      <sl:button variant="outline" size="sm" data-theme-choice="dark">
        <sl:slot name="icon-start"><sl:icon name="moon"/></sl:slot>Dark</sl:button>
      <sl:button variant="outline" size="sm" data-theme-choice="system">
        <sl:slot name="icon-start"><sl:icon name="monitor"/></sl:slot>System</sl:button>
    </div>
  </header>
  <nav class="site-nav" aria-label="Pages">
    <sl:button as="a" variant="ghost" size="sm" th:href="@{/}"
               th:aria-current="${pageTitle == 'Home' ? 'page' : null}">Buttons</sl:button>
    <sl:button as="a" variant="ghost" size="sm" th:href="@{/form}"
               th:aria-current="${pageTitle == 'Form' ? 'page' : null}">Form</sl:button>
  </nav>
  <div th:replace="${content}"></div>
</main>
</body>
</html>
